<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="gaAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4"/>
      <stop offset="50%" style="stop-color:#ea4335"/>
      <stop offset="100%" style="stop-color:#fbbc05"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#gaBg)"/>
  
  <!-- Decorative elements -->
  <circle cx="650" cy="100" r="180" fill="rgba(66,133,244,0.05)"/>
  <circle cx="150" cy="350" r="150" fill="rgba(234,67,53,0.03)"/>
  
  <!-- Google colors bar -->
  <rect x="250" y="80" width="300" height="4" rx="2" fill="url(#gaAccent)"/>
  
  <!-- Title -->
  <text x="400" y="130" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="bold">Google Analytics</text>
  <text x="400" y="165" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">Certifications & Training</text>
  
  <!-- Analytics icon -->
  <text x="400" y="260" text-anchor="middle" font-size="70">📊</text>
  
  <!-- Certification badges -->
  <g transform="translate(150, 300)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="rgba(66,133,244,0.15)"/>
    <text x="70" y="22" text-anchor="middle" fill="#4285f4" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">GA4 Certified</text>
    <text x="70" y="38" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">✓ Verified</text>
  </g>
  
  <g transform="translate(320, 300)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="rgba(234,67,53,0.15)"/>
    <text x="80" y="22" text-anchor="middle" fill="#ea4335" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Offline Sales</text>
    <text x="80" y="38" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">✓ Verified</text>
  </g>
  
  <g transform="translate(510, 300)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="rgba(251,188,5,0.15)"/>
    <text x="70" y="22" text-anchor="middle" fill="#fbbc05" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Data Reports</text>
    <text x="70" y="38" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">✓ Completed</text>
  </g>
  
  <!-- Skills -->
  <text x="400" y="400" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13">Data Analysis • Event Tracking • Audience Segmentation • Tool Integration</text>
  
  <!-- Skillshop badge -->
  <text x="400" y="430" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">View on Google Skillshop →</text>
</svg>
