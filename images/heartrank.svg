<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1025"/>
    </linearGradient>
    <linearGradient id="heartAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#heartBg)"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="180" fill="rgba(236,72,153,0.05)"/>
  <circle cx="600" cy="300" r="200" fill="rgba(236,72,153,0.03)"/>
  
  <!-- Title -->
  <text x="400" y="100" text-anchor="middle" fill="url(#heartAccent)" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="bold">HeartRank</text>
  <text x="400" y="135" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">Photo Rating Web App</text>
  
  <!-- Card mockup -->
  <rect x="300" y="170" width="200" height="180" rx="16" fill="#2d2d44" opacity="0.5" transform="rotate(5 400 260)"/>
  <rect x="300" y="170" width="200" height="180" rx="16" fill="#363654"/>
  
  <!-- Heart emoji -->
  <text x="400" y="280" text-anchor="middle" font-size="60">💕</text>
  
  <!-- Rating slider mockup -->
  <rect x="320" y="320" width="160" height="8" rx="4" fill="#4a4a6a"/>
  <rect x="320" y="320" width="80" height="8" rx="4" fill="url(#heartAccent)"/>
  <circle cx="400" cy="324" r="10" fill="white"/>
  
  <!-- Feature pills -->
  <rect x="180" y="380" width="100" height="28" rx="14" fill="rgba(236,72,153,0.15)"/>
  <text x="230" y="399" text-anchor="middle" fill="#f472b6" font-family="Inter, system-ui, sans-serif" font-size="11">Next.js</text>
  
  <rect x="295" y="380" width="100" height="28" rx="14" fill="rgba(236,72,153,0.15)"/>
  <text x="345" y="399" text-anchor="middle" fill="#f472b6" font-family="Inter, system-ui, sans-serif" font-size="11">TypeScript</text>
  
  <rect x="410" y="380" width="80" height="28" rx="14" fill="rgba(236,72,153,0.15)"/>
  <text x="450" y="399" text-anchor="middle" fill="#f472b6" font-family="Inter, system-ui, sans-serif" font-size="11">Prisma</text>
  
  <rect x="505" y="380" width="100" height="28" rx="14" fill="rgba(236,72,153,0.15)"/>
  <text x="555" y="399" text-anchor="middle" fill="#f472b6" font-family="Inter, system-ui, sans-serif" font-size="11">Tailwind</text>
</svg>
