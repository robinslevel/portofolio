<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="taxiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="taxiAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#taxiBg)"/>
  
  <!-- Decorative circles -->
  <circle cx="650" cy="100" r="200" fill="rgba(245,158,11,0.05)"/>
  <circle cx="150" cy="350" r="150" fill="rgba(245,158,11,0.03)"/>
  
  <!-- Title -->
  <text x="400" y="140" text-anchor="middle" fill="url(#taxiAccent)" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="bold">TAXIPOINT</text>
  <text x="400" y="175" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">Benelux Taxi Service</text>
  
  <!-- Car emoji/icon -->
  <text x="400" y="280" text-anchor="middle" font-size="80">🚕</text>
  
  <!-- Feature pills -->
  <rect x="200" y="340" width="100" height="30" rx="15" fill="rgba(245,158,11,0.15)"/>
  <text x="250" y="360" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="12">Multi-lang</text>
  
  <rect x="320" y="340" width="80" height="30" rx="15" fill="rgba(245,158,11,0.15)"/>
  <text x="360" y="360" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="12">Mobile</text>
  
  <rect x="420" y="340" width="80" height="30" rx="15" fill="rgba(245,158,11,0.15)"/>
  <text x="460" y="360" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="12">i18n</text>
  
  <rect x="520" y="340" width="80" height="30" rx="15" fill="rgba(245,158,11,0.15)"/>
  <text x="560" y="360" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="12">SEO</text>
  
  <!-- Tech badges at bottom -->
  <text x="400" y="420" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14">HTML • CSS • JavaScript</text>
</svg>
