  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="twitter:title" content="Contact — Robin Korkor" />

  <link rel="stylesheet" href="../styling/stylesheet.css" />
</head>
<body>
  <!-- Mobile menu overlay -->
  <section class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <section class="mobile-menu-inner" role="dialog" aria-modal="true" aria-label="Navigation menu">
      <header class="mobile-menu-header">
        <span class="mobile-menu-title">Menu</span>
        <button class="mobile-menu-close" type="button" aria-label="Close navigation">✕</button>
      </header>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="../index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </section>
  </section>

  <section class="wrapper">
    <header>
      <a class="logo" href="../index.html" aria-label="Go to home">
        <span class="logo-orbit" aria-hidden="true"></span>
        <span>ROBIN&nbsp;KORKOR</span>
      </a>

      <button class="mobile-menu-toggle" type="button" aria-label="Open navigation">
        <span></span><span></span>
      </button>

      <section class="header-right">
        <nav class="main-nav" aria-label="Main navigation">
          <a href="../index.html" data-i18n="nav-home">Home</a>
          <a href="portfolio.html" data-i18n="nav-portfolio">Portfolio</a>
          <a href="contact.html" class="active" data-i18n="nav-contact">Contact</a>
        </nav>
      </section>
    </header>

    <main>
      <section class="fade-in contact-section">
        <div class="section-heading">
          <h2 class="section-title">Get in Touch</h2>
          <p class="section-subtitle">Feel free to reach out for collaborations or just a friendly hello!</p>
        </div>

        <form action="/submit" method="POST" class="contact-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </section>
    </main>

    <footer>
      <span>© <span id="year"></span> Robin Korkor. All rights reserved.</span>
    </footer>
  </section>

  <script src="../java/script.js"></script>
</body>
</html>
